<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PicToPaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --red:#E23A2E; --ink:#1c1c1c; --paper:#ffffff; --paper2:#F5F3EC;
    --green:#9CC23F; --muted:#7a756c; --heart:#E5394A;
    --hand:'Patrick Hand', cursive; --marker:'Permanent Marker', cursive;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--hand);background:#EAE7DF;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:18px 14px;gap:10px;-webkit-font-smoothing:antialiased;}
  .caption{font-size:15px;color:#6a655c;text-align:center;max-width:390px;}
  .caption b{font-family:var(--marker);font-weight:400;color:var(--red);}
  .phone{width:390px;max-width:100%;height:800px;max-height:88vh;background:var(--paper);border:3px solid var(--ink);border-radius:30px;overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .chrome{flex-shrink:0;background:var(--red);border-bottom:3px solid var(--ink);padding:10px 12px;position:relative;z-index:30;display:flex;align-items:center;gap:10px;}
  .logo{font-family:var(--marker);font-size:19px;color:#fff;cursor:pointer;line-height:1;letter-spacing:.3px;text-shadow:1px 1px 0 rgba(0,0,0,.25);flex:1;}
  .chrome-actions{display:flex;align-items:center;gap:8px;}
  .icon-btn,.avatar-btn{background:#fff;border:2px solid var(--ink);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--ink);}
  .avatar-btn{border-radius:50%;overflow:hidden;}
  .avatar-btn svg{width:100%;height:100%;}
  .icon-btn svg{width:20px;height:20px;}
  .icon-btn:active,.avatar-btn:active{transform:translateY(1px);}
  .search-wrap{position:absolute;left:10px;right:10px;top:54px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px;z-index:40;}
  .search-wrap input{width:100%;font-family:var(--hand);font-size:17px;border:2px solid var(--ink);border-radius:10px;padding:8px 12px;outline:none;}
  .search-results{margin-top:6px;display:flex;flex-direction:column;}
  .search-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer;}
  .search-row:hover{background:var(--paper2);}
  .search-row .ava{width:34px;height:34px;border:2px solid var(--ink);border-radius:50%;overflow:hidden;flex-shrink:0;}
  .search-row .ava svg{width:100%;height:100%;}
  .search-row .nm{font-size:17px;}
  .search-row .fc{font-size:13px;color:var(--muted);margin-left:auto;}
  .search-empty{padding:10px;color:var(--muted);font-size:15px;}
  .screens{flex:1;position:relative;overflow:hidden;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;}
  .screen.active{display:flex;}
  .scroll{flex:1;overflow-y:auto;padding:14px;}
  .scroll::-webkit-scrollbar{width:0;}
  .screen-title{font-family:var(--marker);font-size:24px;margin:2px 2px 12px;}
  .back-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .back-btn{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:5px 12px;font-family:var(--hand);font-size:16px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .back-btn svg{width:16px;height:16px;}
  .feed-toggle{display:flex;gap:8px;margin:2px 0 12px;}
  .ft{flex:1;text-align:center;border:2.5px solid var(--ink);border-radius:999px;padding:7px 0;font-family:var(--marker);font-size:16px;cursor:pointer;background:#fff;color:var(--ink);}
  .ft.on{background:var(--red);color:#fff;}
  .auth-scroll{display:flex;align-items:flex-start;justify-content:center;}
  .auth-card{width:100%;max-width:320px;margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .auth-logo{font-family:var(--marker);font-size:28px;color:var(--red);text-align:center;margin-bottom:2px;}
  .auth-tabs{display:flex;gap:8px;}
  .at{flex:1;text-align:center;border:2.5px solid var(--ink);border-radius:999px;padding:7px 0;font-family:var(--marker);font-size:16px;cursor:pointer;background:#fff;color:var(--ink);}
  .at.on{background:var(--red);color:#fff;}
  .auth-msg{background:#FFF3B0;border:2px solid var(--ink);border-radius:10px;padding:8px 12px;font-size:15px;}
  .auth-err{color:#c0392b;font-size:15px;min-height:18px;text-align:center;}
  .auth-lbl{font-size:14px;color:var(--muted);margin:2px 2px -4px;}
  .auth-go{margin-top:4px;}
  .auth-skip{text-align:center;color:var(--muted);font-size:15px;text-decoration:underline;cursor:pointer;margin-top:4px;}
  .ava-pick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:6px;}
  .apick{width:54px;height:54px;border:2.5px solid var(--ink);border-radius:50%;overflow:hidden;cursor:pointer;background:#fff;}
  .apick.sel{outline:4px solid var(--green);}
  .apick svg{width:100%;height:100%;}
  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;}
  .filters::-webkit-scrollbar{height:0;}
  .chip{flex-shrink:0;border:2px solid var(--ink);border-radius:999px;padding:5px 13px;font-size:15px;background:#fff;cursor:pointer;white-space:nowrap;color:var(--ink);}
  .chip.on{background:var(--ink);color:#fff;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .card{cursor:pointer;}
  .art-box{position:relative;border:3px solid var(--ink);border-radius:14px;background:#fff;aspect-ratio:1/1;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .art-box .rank{position:absolute;left:-3px;top:-3px;background:var(--red);color:#fff;border:3px solid var(--ink);border-bottom-right-radius:12px;border-top-left-radius:11px;font-family:var(--marker);font-size:15px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .art-svg,.art-img{width:100%;height:100%;display:block;object-fit:cover;}
  .card .c-title{font-size:17px;margin:7px 2px 0;line-height:1.05;}
  .card .c-meta{display:flex;align-items:center;gap:6px;margin:2px 2px 0;color:var(--muted);font-size:14px;}
  .card .c-react{display:flex;align-items:center;gap:8px;margin:4px 2px 0;font-size:14px;}
  .react-num{display:flex;align-items:center;gap:3px;}
  .p-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px;}
  .p-ava{width:74px;height:74px;border:3px solid var(--ink);border-radius:50%;overflow:hidden;flex-shrink:0;}
  .p-ava svg{width:100%;height:100%;}
  .p-name{font-family:var(--marker);font-size:22px;line-height:1.1;}
  .p-followers{font-size:16px;color:var(--muted);margin:2px 0 8px;}
  .p-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);font-family:var(--hand);font-size:16px;padding:6px 16px;cursor:pointer;}
  .btn.follow{background:var(--red);color:#fff;}
  .btn.following{background:#fff;color:var(--ink);}
  .btn.green{background:var(--green);}
  .p-desc{background:#FFF3B0;border:2px solid var(--ink);border-radius:10px;padding:8px 12px;font-size:16px;margin:10px 0 4px;}
  .p-posts-label{font-family:var(--marker);font-size:20px;margin:14px 2px 4px;border-bottom:3px solid var(--red);padding-bottom:4px;}
  .post-overlay{position:absolute;inset:0;z-index:60;background:var(--paper);display:none;flex-direction:column;}
  .post-overlay.open{display:flex;}
  .post-art{flex:1;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;padding:10px;}
  .post-art .art-svg,.post-art .art-img{width:auto;height:auto;max-width:96%;max-height:96%;object-fit:contain;}
  .post-x{position:absolute;top:12px;right:12px;z-index:5;background:#fff;border:2.5px solid var(--ink);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .post-x svg{width:20px;height:20px;}
  .post-nav{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:5;}
  .navchev{background:#fff;border:2.5px solid var(--ink);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .navchev svg{width:20px;height:20px;}
  .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--muted);font-size:15px;z-index:4;pointer-events:none;}
  .post-info{flex-shrink:0;border-top:3px solid var(--ink);background:#fff;padding:10px 14px;}
  .post-info .pi-title{font-family:var(--marker);font-size:19px;text-align:center;margin-bottom:8px;}
  .pi-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .creator-chip{display:flex;align-items:center;gap:7px;cursor:pointer;}
  .creator-chip .ava{width:32px;height:32px;border:2px solid var(--ink);border-radius:50%;overflow:hidden;}
  .creator-chip .ava svg{width:100%;height:100%;}
  .pill{border:2px solid var(--ink);border-radius:999px;padding:3px 11px;font-size:14px;background:#fff;cursor:pointer;}
  .pill.red{background:var(--red);color:#fff;}
  .media-chip{border:2px solid var(--ink);border-radius:8px;padding:3px 10px;font-size:14px;background:var(--paper2);}
  .del-btn{background:#fff;border:2px solid #c0392b;color:#c0392b;border-radius:8px;height:30px;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0 9px;font-family:var(--hand);font-size:14px;}
  .del-btn svg{width:16px;height:16px;}
  .pi-react{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:18px;}
  .pi-react .num{font-size:15px;}
  .emoji-btn{cursor:pointer;background:none;border:none;font-size:20px;padding:0;line-height:1;}
  .heart-btn{cursor:pointer;background:none;border:none;display:flex;align-items:center;gap:3px;font-size:15px;color:var(--ink);font-family:var(--hand);}
  .heart-btn svg{width:22px;height:22px;}
  .steps{display:flex;gap:6px;justify-content:center;margin-bottom:14px;}
  .step-dot{width:24px;height:24px;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:#fff;}
  .step-dot.on{background:var(--green);}
  .step-dot.done{background:var(--ink);color:#fff;}
  .up-h{font-family:var(--marker);font-size:21px;text-align:center;margin-bottom:12px;}
  .pick-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .pick{border:3px solid var(--ink);border-radius:12px;aspect-ratio:1/1;overflow:hidden;cursor:pointer;background:#fff;}
  .pick.sel{outline:4px solid var(--green);outline-offset:0;}
  .up-input{width:100%;font-family:var(--hand);font-size:18px;border:2.5px solid var(--ink);border-radius:10px;padding:10px 14px;outline:none;}
  .up-preview{border:3px solid var(--ink);border-radius:14px;overflow:hidden;width:170px;height:170px;margin:0 auto 12px;background:#fff;}
  .up-nav{display:flex;gap:10px;justify-content:space-between;margin-top:auto;padding-top:14px;}
  .file-label{display:block;text-align:center;margin-top:12px;color:var(--muted);font-size:15px;}
  .file-label span{text-decoration:underline;cursor:pointer;color:var(--ink);}
  .file-label input{display:none;}
  .shield{text-align:center;color:var(--muted);font-size:13px;margin-top:10px;}
  .bot-top{flex-shrink:0;padding:8px 12px;border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:8px;}
  .bot-top .bava{width:34px;height:34px;border:2px solid var(--ink);border-radius:50%;overflow:hidden;background:#fff;}
  .bot-top .bava svg{width:100%;height:100%;}
  .bot-top .bname{font-family:var(--marker);font-size:18px;}
  .bot-top .newchat{margin-left:auto;font-size:14px;}
  .recent{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 0;}
  .recent::-webkit-scrollbar{height:0;}
  .recent .rc{flex-shrink:0;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:14px;background:var(--paper2);cursor:pointer;white-space:nowrap;}
  .bot-thread{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;}
  .bot-thread::-webkit-scrollbar{width:0;}
  .msg{display:flex;gap:9px;align-items:flex-start;max-width:90%;}
  .msg .mava{width:38px;height:38px;flex-shrink:0;}
  .msg .mava svg{width:100%;height:100%;}
  .bubble{background:var(--paper2);border:2.5px solid var(--ink);border-radius:16px;border-top-left-radius:4px;padding:10px 13px;font-size:17px;line-height:1.35;}
  .msg.me{align-self:flex-end;flex-direction:row-reverse;}
  .msg.me .bubble{background:var(--green);border-top-left-radius:16px;border-top-right-radius:4px;}
  .msg.me .bubble img{display:block;width:130px;height:130px;object-fit:cover;border:2px solid var(--ink);border-radius:8px;}
  .suggest{display:flex;flex-wrap:wrap;gap:8px;padding-left:47px;}
  .suggest .sg{border:2px solid var(--ink);border-radius:999px;padding:6px 13px;font-size:15px;background:#fff;cursor:pointer;}
  .composer{flex-shrink:0;border-top:3px solid var(--ink);padding:10px;display:flex;align-items:center;gap:8px;}
  .composer .cam,.composer .send{width:42px;height:42px;border:2.5px solid var(--ink);border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .composer .send{background:var(--green);}
  .composer .cam svg,.composer .send svg{width:22px;height:22px;}
  .composer input[type=text]{flex:1;font-family:var(--hand);font-size:17px;border:2.5px solid var(--ink);border-radius:999px;padding:9px 16px;outline:none;}
  .bot-fab{position:absolute;right:14px;bottom:16px;z-index:50;width:60px;height:60px;border-radius:50%;background:#fff;border:3px solid var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px;}
  .bot-fab svg{width:100%;height:100%;}
  .post-fab{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;z-index:50;width:62px;height:62px;border-radius:50%;background:var(--red);border:3px solid var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;}
  .post-fab svg{width:28px;height:28px;}
  .post-fab:active{transform:translateX(-50%) translateY(1px);}
  .toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:15px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88%;text-align:center;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
  <div class="caption">Post your art, get real coaching from <b>Sketch o' Bot</b>, and every uploaded photo is checked to keep it friendly.</div>

  <div class="phone" id="phone">
    <header class="chrome">
      <div class="logo" onclick="go('feed')">PicToPaper</div>
      <div class="chrome-actions">
        <button class="icon-btn" aria-label="Search creators" onclick="toggleSearch()" id="searchBtn"></button>
        <button class="avatar-btn" aria-label="Log in" onclick="onAvatarClick()" id="meBtn"></button>
      </div>
      <div class="search-wrap" id="searchWrap" hidden>
        <input id="searchInput" placeholder="Search creators…" oninput="onSearch(this.value)" autocomplete="off" />
        <div class="search-results" id="searchResults"></div>
      </div>
    </header>

    <div class="screens">
      <section class="screen active" id="screen-feed"></section>
      <section class="screen" id="screen-profile"></section>
      <section class="screen" id="screen-editprofile"></section>
      <section class="screen" id="screen-upload"></section>
      <section class="screen" id="screen-bot"></section>
      <section class="screen" id="screen-auth"></section>
    </div>

    <div class="post-overlay" id="postOverlay"></div>
    <button class="post-fab" id="postFab" aria-label="New post" onclick="go('upload')"></button>
    <button class="bot-fab" id="botFab" aria-label="Open Sketch o' Bot" onclick="go('bot')"></button>
    <div class="toast" id="toast"></div>
  </div>

<script>
/* ============================================================
   PicToPaper — Supabase database + accounts + real AI
   ============================================================ */

const ICON = {
  search:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>`,
  plus:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  x:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>`,
  up:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg>`,
  down:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`,
  back:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>`,
  camera:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg>`,
  send:`<svg viewBox="0 0 24 24" fill="none" stroke="#1c1c1c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="6"/><polyline points="6 11 12 5 18 11"/></svg>`,
  heart:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20s-7-4.6-7-9.4A3.6 3.6 0 0 1 12 8a3.6 3.6 0 0 1 7 2.6C19 15.4 12 20 12 20z"/></svg>`,
  heartFull:`<svg viewBox="0 0 24 24" fill="#E5394A" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20s-7-4.6-7-9.4A3.6 3.6 0 0 1 12 8a3.6 3.6 0 0 1 7 2.6C19 15.4 12 20 12 20z"/></svg>`,
  user:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>`,
  trash:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V3h6v3"/></svg>`,
};

const BUNNY = `<svg viewBox="0 0 64 80"><g fill="#9CC23F" stroke="#1c1c1c" stroke-width="3.2" stroke-linejoin="round"><rect x="20" y="6" width="9" height="34" rx="4.5" transform="rotate(-6 24.5 23)"/><rect x="35" y="6" width="9" height="34" rx="4.5" transform="rotate(6 39.5 23)"/><rect x="10" y="30" width="44" height="42" rx="13"/></g><g stroke="#1c1c1c" stroke-width="3" stroke-linecap="round" fill="none"><line x1="25" y1="46" x2="25" y2="54"/><line x1="39" y1="46" x2="39" y2="54"/><path d="M32 56 L32 62 M32 62 L28.5 66 M32 62 L35.5 66"/></g><rect x="29" y="48" width="6" height="6" rx="1.2" fill="none" stroke="#1c1c1c" stroke-width="2.4"/></svg>`;

const DEFAULT_AVATAR = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="33" fill="#fff" stroke="#1c1c1c" stroke-width="3.2"/><circle cx="40" cy="48" r="2.6" fill="#1c1c1c"/><circle cx="60" cy="48" r="2.6" fill="#1c1c1c"/><path d="M40 62 q10 7 20 0" fill="none" stroke="#1c1c1c" stroke-width="2.6" stroke-linecap="round"/></svg>`;

function face(parts){
  return `<svg viewBox="0 0 100 100" class="art-svg"><circle cx="50" cy="50" r="33" fill="${parts.bg||'#fff'}" stroke="#1c1c1c" stroke-width="3.2"/>${parts.extra||''}</svg>`;
}

/* shrink a photo before sending it (faster + cheaper to check) */
function downscale(file, cb, max, quality){
  max = max || 1024; quality = quality || 0.85;
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = ()=>{
    let w = img.width, h = img.height;
    if(w>max || h>max){ const s = max/Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    try { cb(c.toDataURL('image/jpeg', quality)); } catch(e){ console.error(e); cb(null); }
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); cb(null); };
  img.src = url;
}

function friendlyAuthError(m){
  m=m||'Something went wrong.';
  if(/invalid login/i.test(m)) return 'That email or password isn\'t right.';
  if(/already registered|already been registered|already exists/i.test(m)) return 'That email already has an account — try logging in.';
  if(/rate limit/i.test(m)) return 'Too many tries — wait a minute, then try again.';
  if(/confirm/i.test(m)) return 'Please confirm your email first (check your inbox).';
  return m;
}

async function doLogin(){
  const email=val('auEmail'), pass=rawVal('auPass');
  if(!email||!pass) return authErr('Type your email and password.');
  authErr('Logging in…');
  const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
  if(error) return authErr(friendlyAuthError(error.message));
  await afterAuth(data.session);
}
async function doSignup(){
  const name=val('auName'), email=val('auEmail'), pass=rawVal('auPass'), dob=val('auDob');
  if(!name) return authErr('Pick an artist name.');
  if(!email||!pass) return authErr('Add an email and a password.');
  if(pass.length<6) return authErr('Password needs 6+ letters.');
  if(!dob) return authErr('Add your birthday.');
  const a=ageFrom(dob);
  if(a===null) return authErr('That birthday looks off.');
  if(a<13) return authErr('Sorry — you need to be 13 or older to make an account.');
  authErr('Creating your account…');
  const { data, error } = await sb.auth.signUp({ email, password:pass, options:{ data:{ display_name:name, birthdate:dob } } });
  if(error) return authErr(friendlyAuthError(error.message));
  if(!data.session){ showAuth('login', 'Almost there! Check your email to confirm your account, then log in.'); return; }
  await afterAuth(data.session);
}

          <div class="ava">${c.ava}</div><span>${esc(c.name)}</span>
        </div>
        ${ !mine && !following ? `<span class="pill red" onclick="event.stopPropagation();toggleFollow('${p.by}')">+ Follow</span>`:''}
        <span class="media-chip">${esc(p.media)}</span>
        ${ mine ? `<button class="del-btn" onclick="event.stopPropagation();deletePost('${p.id}')">${ICON.trash} Delete</button>`:''}
        <span class="pi-react">
          <button class="emoji-btn" title="Smile" onclick="event.stopPropagation();bump('smiley')">🙂</button>
          <button class="emoji-btn" title="Thumbs up" onclick="event.stopPropagation();bump('thumbs')">👍</button>
          <button class="heart-btn" onclick="event.stopPropagation();toggleHeart('${p.id}')">${hearted?ICON.heartFull:ICON.heart}<span class="num" style="color:#E5394A">${fmt(heartsOf(p))}</span></button>
        </span>
      </div>
    </div>` : '';
  document.getElementById('postOverlay').innerHTML = `
    <div class="post-x" onclick="closePost()">${ICON.x}</div>
    <div class="post-nav">
      <div class="navchev" onclick="prevPost()">${ICON.up}</div>
      <div class="navchev" onclick="nextPost()">${ICON.down}</div>
    </div>
    <div class="post-art" onclick="toggleInfo()">
      ${artHTML(p.art)}
      ${!state.infoRevealed?'<div class="hint">tap the art to see who made it ·  ⌃ ⌄ for next</div>':''}
    </div>
    ${info}`;
}
function toggleInfo(){ state.infoRevealed=!state.infoRevealed; renderPost(); }
function nextPost(){ state.postIndex=(state.postIndex+1)%state.postList.length; state.infoRevealed=false; renderPost(); }
function prevPost(){ state.postIndex=(state.postIndex-1+state.postList.length)%state.postList.length; state.infoRevealed=false; renderPost(); }
async function toggleHeart(id){
  if(!state.me){ requireLogin('heart art'); return; }
  const had = state.hearted.has(id);
  if(had) state.hearted.delete(id); else state.hearted.add(id);
  renderPost();
  try{
    if(had) await sb.from('reactions').delete().match({post_id:id,user_id:state.me,type:'heart'});
    else await sb.from('reactions').insert({post_id:id,user_id:state.me,type:'heart'});
  }catch(e){ if(had) state.hearted.add(id); else state.hearted.delete(id); renderPost(); toast('Could not save — try again'); }
}
async function bump(type){
  if(!state.me){ requireLogin('react'); return; }
  const p=state.postList[state.postIndex]; if(!p) return;
  toast((type==='smiley'?'🙂':'👍')+' reaction saved!');
  try{ await sb.from('reactions').insert({post_id:p.id,user_id:state.me,type}); }catch(e){}
}
async function deletePost(id){
  if(!window.confirm('Delete this post? This can\'t be undone.')) return;
  const { error } = await sb.from('posts').delete().eq('id', id);
  if(error){ console.error(error); toast('Could not delete — try again'); return; }
  POSTS = POSTS.filter(p=>p.id!==id);
  toast('Post deleted.');
  closePost();
  if(state.screen==='profile') renderProfile(state.profileId); else renderFeed();
}

/* ================= PROFILE ================= */
function openProfile(id){
  closePost();
  activate('profile');
  renderProfile(id);
}
function renderProfile(id){
  const c=CREATORS[id]; if(!c) return;
  state.profileId=id;
  const mine = id===state.me;
  const following = state.following.has(id);
  const fc = (c.followers||0) + (following?1:0);
  const posts = POSTS.filter(p=>p.by===id).sort((a,b)=>heartsOf(b)-heartsOf(a));
  const btns = mine
    ? `<button class="btn" onclick="openEditProfile()">Edit profile</button><button class="btn" onclick="doLogout()">Log out</button>`
    : `<button class="btn ${following?'following':'follow'}" onclick="toggleFollow('${id}')">${following?'Following ✓':'Follow'}</button>`;
  const grid = posts.length ? posts.map(p=>`
    <div class="card" onclick="openPost('profile:${id}','${p.id}')">
      <div class="art-box">${artHTML(p.art)}</div>
      <div class="c-react" style="justify-content:center"><span style="color:#E5394A">❤️ ${fmt(heartsOf(p))}</span></div>
    </div>`).join('') : `<p style="color:#7a756c;grid-column:1/3;text-align:center;margin-top:10px">${mine?'No art yet — tap the + to post your first drawing!':'No posts yet.'}</p>`;
  document.getElementById('screen-profile').innerHTML = `
    <div class="scroll">
      <div class="back-row"><button class="back-btn" onclick="go('feed')">${ICON.back} Home</button></div>
      <div class="p-head">
        <div class="p-ava">${c.ava}</div>
        <div style="flex:1">
          <div class="p-name">${esc(c.name)}</div>
          <div class="p-followers">${fmt(fc)||fc} followers</div>
          <div class="p-btns">${btns}</div>
        </div>
      </div>
      <div class="p-desc">Description: ${esc(c.desc)}</div>
      <div class="p-posts-label">Posts</div>
      <div class="grid">${grid}</div>
      <div style="height:74px"></div>
    </div>`;
}
async function toggleFollow(id){
  if(!state.me){ requireLogin('follow artists'); return; }
  const had=state.following.has(id);
  if(had){ state.following.delete(id); toast('Unfollowed '+(CREATORS[id]?CREATORS[id].name:'')); }
  else { state.following.add(id); toast('Now following '+(CREATORS[id]?CREATORS[id].name:'')+'! 🎉'); }
  if(document.getElementById('postOverlay').classList.contains('open')) renderPost();
  if(state.screen==='profile') renderProfile(state.profileId);
  if(state.screen==='feed' && state.feedView==='following') renderFeed();
  try{
    if(had) await sb.from('follows').delete().match({follower_id:state.me,following_id:id});
    else await sb.from('follows').insert({follower_id:state.me,following_id:id});
  }catch(e){ if(had) state.following.add(id); else state.following.delete(id); toast('Could not save'); }
}

/* ================= SEARCH ================= */
function toggleSearch(){
  const w=document.getElementById('searchWrap');
  if(w.hidden){ w.hidden=false; document.getElementById('searchInput').focus(); onSearch(''); }
  else hideSearch();
}
function hideSearch(){ const w=document.getElementById('searchWrap'); if(w){ w.hidden=true; const i=document.getElementById('searchInput'); if(i) i.value=''; } }
function onSearch(q){
  q=q.trim().toLowerCase();
  const ids=Object.keys(CREATORS).filter(id=> (CREATORS[id].name||'').toLowerCase().includes(q));
  const html = ids.length? ids.map(id=>{
    const c=CREATORS[id];
    return `<div class="search-row" onclick="openProfile('${id}')">
      <div class="ava">${c.ava}</div><div class="nm">${esc(c.name)}</div><div class="fc">${fmt(c.followers)||c.followers}</div>
    </div>`;
  }).join('') : `<div class="search-empty">No creators found.</div>`;
  document.getElementById('searchResults').innerHTML=html;
}

/* ================= UPLOAD (5 steps, moderated) ================= */
const SAMPLE_ART = ['happy','grumpy','sleepy','rainbow','dragon','slime'];
function renderUpload(){
  const u=state.upload;
  const dots=[1,2,3,4,5].map(n=>`<div class="step-dot ${n===u.step?'on':(n<u.step?'done':'')}">${n<u.step?'✓':n}</div>`).join('');
  let body='';
  if(u.step===1){
    const picks=SAMPLE_ART.map(k=>`<div class="pick ${u.art&&u.art.key===k?'sel':''}" onclick="pickArt('${k}')">${ART[k]}</div>`).join('');
    body=`<div class="up-h">Pick your drawing</div>
      <div class="pick-grid">${picks}</div>
      <label class="file-label">…or <span>upload a photo</span> of a real drawing<input type="file" accept="image/*" onchange="uploadPhoto(event)"></label>
      <div class="shield">🛡️ Photos are checked by Sketch o' Bot to keep PicToPaper friendly.</div>`;
  } else if(u.step===2){
    body=`<div class="up-h">Give it a title</div>
      <div class="up-preview">${u.art?artHTML(u.art):''}</div>
      <input class="up-input" id="upTitle" placeholder="Type a title…" value="${esc(u.title)}" oninput="state.upload.title=this.value">`;
  } else if(u.step===3){
    const opts=MEDIA_TYPES.filter(m=>m!=='All').map(m=>`<div class="chip ${u.media===m?'on':''}" onclick="state.upload.media='${m}';renderUpload()">${m}</div>`).join('');
    body=`<div class="up-h">What did you use?</div>
      <div class="up-preview">${u.art?artHTML(u.art):''}</div>
      <div class="filters" style="flex-wrap:wrap;justify-content:center">${opts}</div>`;
  } else if(u.step===4){
    body=`<div class="up-h">Look good? Post it!</div>
      <div class="up-preview">${u.art?artHTML(u.art):''}</div>
      <div style="text-align:center;font-size:18px">“${esc(u.title||'Untitled')}”</div>
      <div style="text-align:center;color:#7a756c;margin-top:4px">${esc(u.media||'—')}</div>`;
  }
  const back = u.step>1?`<button class="btn" onclick="upStep(-1)">Back</button>`:`<button class="btn" onclick="go('feed')">Cancel</button>`;
  let next;
  if(u.step<4){
    const ready = (u.step===1&&u.art)||(u.step===2&&u.title.trim())||(u.step===3&&u.media);
    next=`<button class="btn green" onclick="upStep(1)" ${ready?'':'style="opacity:.4"'}>Next</button>`;
  } else {
    next=`<button class="btn green" onclick="finishUpload()">Post it! 🎉</button>`;
  }
  document.getElementById('screen-upload').innerHTML=`
    <div class="scroll" style="display:flex;flex-direction:column">
      <div class="back-row"><button class="back-btn" onclick="go('feed')">${ICON.back} Home</button></div>
      <div class="steps">${dots}</div>
      ${body}
      <div class="up-nav">${back}${next}</div>
    </div>`;
}
function pickArt(k){ state.upload.art={type:'svg',svg:ART[k],key:k}; renderUpload(); }
function uploadPhoto(ev){
  const f=ev.target.files[0]; if(!f) return; ev.target.value='';
  toast('Loading photo…');
  downscale(f,(dataUrl)=>{
    if(!dataUrl){ toast('Could not read that image.'); return; }
    state.upload.art={type:'img',src:dataUrl,key:'photo'};
    renderUpload();
  });
}
function upStep(d){
  const u=state.upload;
  if(d>0){
    if(u.step===1&&!u.art) return toast('Pick a drawing first!');
    if(u.step===2&&!u.title.trim()) return toast('Add a title!');
    if(u.step===3&&!u.media) return toast('Choose a media type!');
  }
  u.step=Math.min(4,Math.max(1,u.step+d));
  renderUpload();
}
async function finishUpload(){
  const u=state.upload;
  if(!state.me){ requireLogin('post your art'); return; }
  if(!u.art){ toast('Pick a drawing first!'); return; }
  toast(u.art.type==='img' ? '🛡️ Checking your art…' : 'Posting…');
  try{
    const body={ title:u.title.trim()||'Untitled', media_type:u.media||'Pencil' };
    if(u.art.type==='img') body.image_base64=u.art.src; else body.sample_key=u.art.key;
    const { data, error } = await sb.functions.invoke('submit-post', { body });
    if(error) throw error;
    if(data && data.rejected){ toast(data.reason || 'That image didn\'t pass our friendly-art check.'); return; }
    if(!data || !data.ok || !data.post){ toast((data&&data.error)||'Could not post — try again'); return; }
    const d=data.post;
    const post={id:d.id, by:d.creator_id, title:d.title, media:d.media_type, hearts:0, created_at:d.created_at, art: d.art_svg?{type:'svg',svg:d.art_svg}:{type:'img',src:d.image_url}};
    POSTS.unshift(post);
    toast('Posted! 🎉 Your art is saved.');
    openPost('profile:'+state.me, post.id);
    activateBehind('profile'); renderProfile(state.me);
  }catch(e){ console.error(e); toast('Could not post — try again'); }
}
function activateBehind(name){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); const el=document.getElementById('screen-'+name); if(el) el.classList.add('active'); state.screen=name; }

/* ================= SKETCH O' BOT (real AI) ================= */
const RECENTS = [ {title:"My watercolor practice"}, {title:"Drawing hands help"} ];
function renderBot(){
  const recent = RECENTS.map(r=>`<div class="rc" onclick="openRecent('${r.title}')">${r.title}</div>`).join('');
  document.getElementById('screen-bot').innerHTML=`
    <div class="bot-top">
      <div class="bava">${BUNNY}</div>
      <div class="bname">Sketch o' Bot</div>
      <button class="back-btn newchat" onclick="newChat()">+ New chat</button>
    </div>
    <div class="recent">${recent}<div class="rc" onclick="go('feed')">‹ Home</div></div>
    <div class="bot-thread" id="botThread"></div>
    <div class="composer">
      <input type="file" id="botFile" accept="image/*" style="display:none" onchange="botPhoto(event)">
      <button class="cam" aria-label="Show a drawing" onclick="botCamera()">${ICON.camera}</button>
      <input type="text" id="botInput" placeholder="Ask Sketch o' Bot…" onkeydown="if(event.key==='Enter')botSend()">
      <button class="send" aria-label="Send" onclick="botSend()">${ICON.send}</button>
    </div>`;
  if(!state.botVisited && state.botMessages.length===0){
    state.botMessages.push({who:'bot', text:"Hi! I'm Sketch o' Bot. Show me a drawing, or ask me anything about making art!", suggest:true});
    state.botVisited=true;
  }
  drawThread();
}
function drawThread(){
  const t=document.getElementById('botThread'); if(!t) return;
  t.innerHTML = state.botMessages.map(m=>{
    if(m.who==='bot'){
      if(m.thinking) return `<div class="msg"><div class="mava">${BUNNY}</div><div><div class="bubble" style="opacity:.65;font-style:italic">thinking…</div></div></div>`;
      const sg = m.suggest? `<div class="suggest">
        <div class="sg" onclick="botSend('How do I shade with pencil?')">How do I shade with pencil?</div>
        <div class="sg" onclick="botSend('Help me blend watercolors')">Help me blend watercolors</div>
        <div class="sg" onclick="botSend('Critique my drawing')">Critique my drawing</div></div>`:'';
      return `<div class="msg"><div class="mava">${BUNNY}</div><div><div class="bubble">${esc(m.text).replace(/\n/g,'<br>')}</div></div></div>${sg}`;
    }
    const inner = m.img? `<img src="${m.img}" alt="">` : esc(m.text);
    return `<div class="msg me"><div class="bubble">${inner}</div></div>`;
  }).join('');
  t.scrollTop=t.scrollHeight;
}
function botSend(preset){
  if(!state.me){ requireLogin('chat with Sketch o\' Bot'); return; }
  if(state.botBusy) return;
  const input=document.getElementById('botInput');
  const text = preset!==undefined? preset : (input? input.value.trim():'');
  if(!text) return;
  if(input) input.value='';
  state.botMessages.forEach(m=>m.suggest=false);
  state.botMessages.push({who:'me', text});
  askBot(null);
}
function botCamera(){
  if(!state.me){ requireLogin('chat with Sketch o\' Bot'); return; }
  const f=document.getElementById('botFile'); if(f) f.click();
}
function botPhoto(ev){
  const f=ev.target.files[0]; if(!f) return; ev.target.value='';
  downscale(f,(dataUrl)=>{
    if(!dataUrl){ toast('Could not read that image.'); return; }
    state.botMessages.forEach(m=>m.suggest=false);
    state.botMessages.push({who:'me', img:dataUrl});
    askBot(dataUrl);
  });
}
async function askBot(image){
  state.botBusy = true;
  state.botMessages.push({who:'bot', thinking:true});
  drawThread();
  const history = state.botMessages.filter(m=>!m.thinking)
    .map(m=>({ role: m.who==='me'?'user':'assistant', text: m.text || (m.img?'(shared a drawing)':'') }))
    .filter(m=>m.text);
  let reply;
  try{
    const { data, error } = await sb.functions.invoke('sketch-bot', { body:{ messages:history, image: image||null } });
    if(error) throw error;
    reply = (data && data.reply) || 'Hmm, try asking me another way!';
  }catch(e){
    console.error(e);
    reply = "Sketch o' Bot is taking a quick nap — try again in a moment! 🐰";
  }
  state.botMessages = state.botMessages.filter(m=>!m.thinking);
  state.botMessages.push({who:'bot', text: reply});
  state.botBusy = false;
  drawThread();
}
function newChat(){ state.botMessages=[]; state.botVisited=false; renderBot(); }
function openRecent(title){
  if(!state.me){ requireLogin('chat with Sketch o\' Bot'); return; }
  state.botMessages=[]; state.botVisited=true;
  botSend(title==='My watercolor practice'?'How do I get better at watercolor blending?':'Can you help me learn to draw hands?');
}

/* ---------- keyboard + swipe for the post viewer ---------- */
document.addEventListener('keydown',e=>{
  if(!document.getElementById('postOverlay').classList.contains('open')) return;
  if(e.key==='ArrowDown') nextPost();
  if(e.key==='ArrowUp') prevPost();
  if(e.key==='Escape') closePost();
});
let touchY=null;
const ovEl=document.getElementById('postOverlay');
ovEl.addEventListener('touchstart',e=>{ touchY=e.touches[0].clientY; },{passive:true});
ovEl.addEventListener('touchend',e=>{
  if(touchY===null) return;
  const dy=e.changedTouches[0].clientY-touchY;
  if(dy<-50) nextPost(); else if(dy>50) prevPost();
  touchY=null;
});

/* ---------- start ---------- */
init();
</script>
</body>
</html>
